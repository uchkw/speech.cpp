[project]
name = "speech-cpp-haas-encoder-reference"
version = "0"
description = "Dumps Haas's official NeMo frontend, encoder and encoder projection on a Mac CPU without its prediction network"
requires-python = ">=3.11,<3.12"
dependencies = [
  "nemo-toolkit[asr]==2.7.3",
  "torch==2.14.0",
  "lightning==2.4.0",
  "numpy==2.4.6",
  "soundfile==0.14.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# These are the compatible dependency versions pinned by the full Haas reference.
override-dependencies = [
  "fsspec[http]==2026.9.0",
  "hydra-core==1.3.8",
  "packaging==26.3",
  "transformers==5.20.2",
  "virtualenv>=21.14.9",
]
