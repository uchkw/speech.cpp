[project]
name = "speech-cpp-haas-encoder-reference"
version = "0"
description = "Dumps Haas's official NeMo frontend, encoder and encoder projection on a Mac CPU without its prediction network"
requires-python = ">=3.11,<3.12"
dependencies = [
  "nemo-toolkit[asr]==2.7.3",
  "torch==2.14.0",
  "lightning==2.4.0",
  "numpy==2.4.6",
  "soundfile==0.14.0",
  "gguf==0.19.0",
  "sentencepiece[protobuf]==0.2.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# The full Haas reference supplies these overrides, apart from the Darwin protobuf requirement below.
override-dependencies = [
  "fsspec[http]==2026.9.0",
  "hydra-core==1.3.8",
  "packaging==26.3",
  "transformers==5.20.2",
  "virtualenv>=21.14.9",
  # SentencePiece 0.2.2's Darwin wheel has gencode 7.36.1, which cannot use NeMo's older protobuf runtime pin.
  # This overrides NeMo's package constraint; only the encoder dumps and archive conversion are checked here.
  "protobuf==7.36.1",
]
