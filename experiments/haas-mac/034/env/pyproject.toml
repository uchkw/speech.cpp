[project]
name = "speech-cpp-haas-coreml-prototype"
version = "0"
description = "Isolated Core ML conversion of the official Haas encoder and encoder projection"
requires-python = ">=3.11,<3.12"
dependencies = [
  "coremltools==9.0",
  "torch==2.7.0",
  "nemo-toolkit[asr]==2.7.3",
  "lightning==2.4.0",
  "numpy==2.4.6",
  "soundfile==0.14.0",
  "gguf==0.19.0",
  "sentencepiece[protobuf]==0.2.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# These are the encoder reference's compatibility exceptions, not a validated converter environment.
override-dependencies = [
  "fsspec[http]==2026.9.0",
  "hydra-core==1.3.8",
  "packaging==26.3",
  "transformers==5.20.2",
  "virtualenv>=21.14.9",
  "protobuf==7.36.1",
]
